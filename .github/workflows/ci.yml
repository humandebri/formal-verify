name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.10', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      Z3_VERSION: 5.4.1.0
      CVC5_VERSION: 1.4.2
      QUINT_VERSION: 0.34.0
      LEAN_VERSION: v4.36.0
      KANI_VERSION: 0.68.0
      VERUS_VERSION: 0.2026.11.22.1ce6a59
      VERUS_RUST: 1.100.0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry
            ~/.kani
            ~/.rustup/toolchains
            ~/.elan
          key: verifiers-${{ runner.os }}-kani${{ env.KANI_VERSION }}-lean${{ env.LEAN_VERSION }}-rust${{ env.VERUS_RUST }}

      - name: Install Z3
        run: pip install "z3-solver==${Z3_VERSION}"
      - name: Install cvc5
        run: |
          curl -fsSL -o cvc5.zip "https://github.com/cvc5/cvc5/releases/download/cvc5-${CVC5_VERSION}/cvc5-Linux-x86_64-static.zip"
          unzip -q cvc5.zip -d "$RUNNER_TOOL_CACHE/cvc5"
          echo "$(dirname "$(find "$RUNNER_TOOL_CACHE/cvc5" -type f -name cvc5 | head -1)")" >> "$GITHUB_PATH"
      - name: Install Quint
        run: npm install -g "@informalsystems/quint@${QUINT_VERSION}"
      - name: Install Lean
        run: |
          if ! command -v "$HOME/.elan/bin/lean" >/dev/null; then
            curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain "leanprover/lean4:${LEAN_VERSION}"
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Install Kani
        run: |
          if ! command -v kani >/dev/null || ! kani --version | grep -q "${KANI_VERSION}"; then
            cargo install --locked kani-verifier --version "${KANI_VERSION}"
          fi
          cargo kani setup
      - name: Install Verus
        run: |
          rustup toolchain install "${VERUS_RUST}" --profile minimal
          curl -fsSL -o verus.zip "https://github.com/verus-lang/verus/releases/download/release%2F${VERUS_VERSION}/verus-${VERUS_VERSION}-x86-linux.zip"
          unzip -q verus.zip -d "$RUNNER_TOOL_CACHE/verus"
          echo "$(dirname "$(find "$RUNNER_TOOL_CACHE/verus" -type f -name verus | head -1)")" >> "$GITHUB_PATH"

      - name: Show detected tools
        run: python scripts/verify.py detect
      - name: Integration tests
        env:
          FORMAL_VERIFY_INTEGRATION: '1'
          FORMAL_VERIFY_REQUIRE_ALL: '1'
        run: python -m unittest tests/test_integration.py -v
